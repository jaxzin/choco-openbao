name: publish

# Publishes the package to the Chocolatey Community Repository.
#
# Triggered two ways:
#   * push of a version tag (e.g. `v2.5.4`) — the manual release path
#   * workflow_call — invoked by auto-tag.yml after it creates a tag on a version bump
#
# Requires a repository secret named CHOCO_API_KEY containing your
# community.chocolatey.org API key (Account -> API Keys on the website).

on:
  push:
    tags:
      - 'v*'
  workflow_call:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the nuspec version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $nuspecVersion = ([xml](Get-Content openbao.nuspec)).package.metadata.version
          Write-Host "Tag version:    $tag"
          Write-Host "Nuspec version: $nuspecVersion"
          if ($tag -ne $nuspecVersion) {
            throw "Tag '$tag' does not match openbao.nuspec version '$nuspecVersion'. Bump the nuspec (or retag) so they match before publishing."
          }

      - name: Pack
        shell: pwsh
        run: choco pack openbao.nuspec --outputdirectory .

      - name: Push to the Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) { throw "The CHOCO_API_KEY secret is not set on this repository." }
          $nupkg = Get-ChildItem -Filter 'openbao.*.nupkg' | Select-Object -First 1
          $version = ([xml](Get-Content openbao.nuspec)).package.metadata.version
          Write-Host "Pushing $($nupkg.Name) to community.chocolatey.org"
          $out = choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -eq 0) { exit 0 }

          # choco returns 409 for two very different situations, with identical
          # wording ("version already exists OR a nuspec element is invalid"):
          #   1. the version really is already on the gallery (benign re-push)
          #   2. the gallery rejected the package at validation time (real failure)
          # Only (1) is safe to swallow. Ask the gallery whether this exact
          # id+version exists; treat the 409 as success only if it does.
          if ($out -match '409') {
            $url = "https://community.chocolatey.org/api/v2/Packages(Id='openbao',Version='$version')"
            try { $status = (Invoke-WebRequest -Uri $url -UseBasicParsing -Method Get).StatusCode }
            catch { $status = $_.Exception.Response.StatusCode.value__ }
            if ($status -eq 200) {
              Write-Host "::notice::openbao $version already exists on the gallery (409) — treating as success."
              exit 0
            }
            throw "choco push returned 409 but openbao $version is NOT on the gallery (lookup HTTP $status). This is a validation rejection, not a duplicate — check the nuspec."
          }
          throw "choco push failed with exit code $code"
