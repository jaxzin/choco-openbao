name: update

# Checks for a newer OpenBao release on a schedule (and on demand). When a new
# version is found the package files are bumped and a pull request is opened for
# review. Publishing to the Chocolatey Community Repository stays a manual,
# reviewed step (see README).

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  au-update:
    runs-on: windows-latest
    steps:
      # Mint a short-lived token for a GitHub App installed on this repo. Commits
      # created with this token (via create-pull-request's sign-commits) are
      # signed by GitHub and show as "Verified", so the AU bump PR satisfies the
      # "commits must have verified signatures" branch-protection rule on main
      # and can be merged normally.
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AU_APP_ID }}
          private-key: ${{ secrets.AU_APP_PRIVATE_KEY }}

      # Check out into a subdirectory named after the package id. chocolatey-au
      # derives the package name from the leaf of the working directory and then
      # looks for "<leaf>.nuspec", so the directory MUST be named "openbao" (not
      # the repo name "choco-openbao") or Update-Package throws
      # "No nuspec file found in the package directory".
      - uses: actions/checkout@v7
        with:
          path: openbao
          token: ${{ steps.app-token.outputs.token }}

      - name: Install chocolatey-au
        shell: pwsh
        run: Install-Module -Name au -Force -Scope CurrentUser

      - name: Run the updater
        shell: pwsh
        working-directory: openbao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update.ps1

      - name: Open a pull request if the package changed
        uses: peter-evans/create-pull-request@v8
        with:
          path: openbao
          token: ${{ steps.app-token.outputs.token }}
          # Create the commit through the GitHub API so it is signed and shows as
          # "Verified" (required to merge under branch protection). Needs the App
          # token above, not the default GITHUB_TOKEN.
          sign-commits: true
          commit-message: "Update OpenBao package to the latest release"
          title: "Update OpenBao package to the latest release"
          body: |
            Automated update produced by `update.ps1` (chocolatey-au).

            Please review the version, download URLs, and checksums before merging.
          branch: au/openbao-update
          delete-branch: true
          add-paths: |
            openbao.nuspec
            tools/chocolateyInstall.ps1
